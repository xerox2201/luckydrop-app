name: Gemini Autonomous Agent

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'دستور مستقیم به جمینای'
        required: true
        default: 'کل پروژه را اسکن کن، تست‌ها را اجرا کن و گزارش بده.'

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  gemini-agent:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.comment && contains(github.event.comment.body, '@gemini-cli')) ||
      (github.event.issue && contains(github.event.issue.body, '@gemini-cli'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure .npmrc for Render & GitHub
        run: |
          if [ ! -f .npmrc ]; then
            echo "legacy-peer-deps=true" > .npmrc
          fi

      - name: Install Dependencies Safely
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run Automated TypeScript & E2E Financial Audit
        run: |
          npx tsc --noEmit
          npm run build
          npm test --if-present

      - name: Configure Gemini CLI Flash Model (Avoid 503 Overload)
        run: |
          mkdir -p ~/.gemini
          echo '{"model": "gemini-2.5-flash"}' > ~/.gemini/settings.json

      - name: Run Gemini CLI Agent
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GEMINI_MODEL: 'gemini-2.5-flash'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are the Principal Full-Stack Architect for the LuckyDrop Telegram Mini-App repository.
            1. Preserve 6-decimal PAM accounting (toFixed(6)) and the 5-way revenue split.
            2. Zero Text-Emojis allowed: use only vector components from src/components/ui/LuxuryIcons.tsx.
            3. Maintain 100% 5-language localization (fa, en, ru, ar, es).
            4. Review the repository status and reply directly on the GitHub Issue with your full Persian report.

            USER INSTRUCTION:
            ${{ github.event.inputs.prompt || github.event.comment.body || github.event.issue.body }}
