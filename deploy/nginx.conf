# ==============================================================================
# LUCKYDROP VIP — PRODUCTION NGINX CONFIGURATION (UBUNTU 24.04 LTS)
# Path on VPS: /etc/nginx/sites-available/luckydrop.conf
# ==============================================================================
# Features:
# - Reverse Proxy to Node.js / Express + Vite Server (127.0.0.1:3000)
# - WebSocket Upgrade Support for Live Crash & Real-Time Oracle Ticker
# - Strict IP Rate Limiting on /api/wallet, /api/pam, /api/tickets, /api/telegram/webhook
# - Telegram Mini App Security Headers (CSP frame-ancestors https://web.telegram.org)
# - Let's Encrypt Certbot SSL/TLS 1.3 Ready
# ==============================================================================

# Rate Limiting Zones (Protects against brute-force & DDoS on financial endpoints)
limit_req_zone $binary_remote_addr zone=wallet_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=pam_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=20r/s;

upstream luckydrop_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_HERE www.YOUR_DOMAIN_HERE;

    # Allow Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Production Server (Telegram WebApp Requires Strict HTTPS + TLS 1.2/1.3)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN_HERE www.YOUR_DOMAIN_HERE;

    # Let's Encrypt SSL Certificates (Auto-managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ==========================================================================
    # STRICT DEVSECOPS & TELEGRAM MINI APP SECURITY HEADERS
    # ==========================================================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Allow embedding inside official Telegram Web/Desktop/Mobile clients ONLY
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org;" always;

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 1. Rate-Limited Wallet Deposit & Withdrawal Endpoints
    location ~ ^/api/(wallet|deposit|admin) {
        limit_req zone=wallet_limit burst=10 nodelay;
        proxy_pass http://luckydrop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
    }

    # 2. Rate-Limited PAM Seamless Wallet & Lottery Ticket Endpoints
    location ~ ^/api/(pam|tickets) {
        limit_req zone=pam_limit burst=25 nodelay;
        proxy_pass http://luckydrop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
    }

    # 3. Official Telegram Bot Webhook Endpoint (/start, Stars XTR, Inline Admin Callbacks)
    location /api/telegram/webhook {
        limit_req zone=webhook_limit burst=30 nodelay;
        proxy_pass http://luckydrop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    }

    # 4. Main Application & WebSocket Proxy
    location / {
        proxy_pass http://luckydrop_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
