<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <radialGradient id="bgVault" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#261247" />
      <stop offset="55%" stop-color="#110822" />
      <stop offset="100%" stop-color="#07040E" />
    </radialGradient>

    <linearGradient id="goldBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="55%" stop-color="#D97706" />
      <stop offset="80%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="goldDropBody" x1="20%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="22%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="78%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="goldDropHighlight" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#FEF08A" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="tonCyanCore" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <radialGradient id="ambientGoldGlow" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.48" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#07040E" stop-opacity="0" />
    </radialGradient>

    <filter id="dropShadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Outer App Icon Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgVault)" />
  <rect x="20" y="20" width="472" height="472" rx="108" stroke="url(#goldBezel)" stroke-width="8" />
  <rect x="34" y="34" width="444" height="444" rx="96" stroke="#FDE047" stroke-opacity="0.18" stroke-width="2" />

  <!-- Volumetric Ambient Glow -->
  <circle cx="256" cy="264" r="196" fill="url(#ambientGoldGlow)" />

  <!-- Subtle Geometric Vault Ring -->
  <circle cx="256" cy="272" r="148" stroke="url(#goldBezel)" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="256" cy="272" r="126" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Royal 24K Gold Crown Crest (Top) -->
  <g filter="url(#dropShadow3D)">
    <path
      d="M188 126L216 154L256 106L296 154L324 126L312 180H200L188 126Z"
      fill="url(#goldDropBody)"
      stroke="#FFFBEB"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <rect x="198" y="182" width="116" height="14" rx="7" fill="url(#goldBezel)" />
    <circle cx="256" cy="96" r="8" fill="#FFFBEB" />
    <circle cx="184" cy="118" r="6.5" fill="#FDE047" />
    <circle cx="328" cy="118" r="6.5" fill="#FDE047" />
    <circle cx="256" cy="160" r="6" fill="#38BDF8" />
    <circle cx="224" cy="165" r="4.5" fill="#FFFBEB" />
    <circle cx="288" cy="165" r="4.5" fill="#FFFBEB" />
  </g>

  <!-- Centerpiece: 3D Golden Liquid Drop ("LuckyDrop") -->
  <g filter="url(#dropShadow3D)">
    <path
      d="M256 198C256 198 158 298 158 358C158 412.124 201.876 456 256 456C310.124 456 354 412.124 354 358C354 298 256 198 256 198Z"
      fill="url(#goldDropBody)"
      stroke="url(#goldBezel)"
      stroke-width="5"
    />
    <!-- Left Specular 3D Reflection on Golden Drop -->
    <path
      d="M246 218C222 252 178 308 178 354C178 389 199 419 228 432C198 412 192 380 196 348C200 312 228 258 246 218Z"
      fill="url(#goldDropHighlight)"
    />

    <!-- Inner Recessed Obsidian & Gold Socket -->
    <circle cx="256" cy="356" r="66" fill="#0B0616" stroke="url(#goldBezel)" stroke-width="4" />

    <!-- Glowing Sapphire TON Crystal Diamond Core -->
    <path
      d="M214 332H298L256 404L214 332Z"
      fill="url(#tonCyanCore)"
      stroke="#E0F2FE"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <path
      d="M214 332L256 352L298 332M256 352V404"
      stroke="#BAE6FD"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Orbiting Golden Lottery Spheres & Starlight -->
  <g filter="url(#dropShadow3D)">
    <circle cx="132" cy="252" r="22" fill="url(#goldDropBody)" stroke="#FFFBEB" stroke-width="2" />
    <text x="132" y="258" text-anchor="middle" fill="#1E1000" font-family="Outfit, sans-serif" font-weight="900" font-size="18">7</text>

    <circle cx="380" cy="252" r="22" fill="url(#goldDropBody)" stroke="#FFFBEB" stroke-width="2" />
    <text x="380" y="258" text-anchor="middle" fill="#1E1000" font-family="Outfit, sans-serif" font-weight="900" font-size="16">24</text>
  </g>

  <!-- Crisp Four-Point Starlight Sparkles -->
  <path d="M116 172L120 184L132 188L120 192L116 204L112 192L100 188L112 184L116 172Z" fill="#FDE047" />
  <path d="M396 172L399 181L408 184L399 187L396 196L393 187L384 184L393 181L396 172Z" fill="#38BDF8" />
  <circle cx="256" cy="248" r="5" fill="#FFFFFF" />
</svg>
