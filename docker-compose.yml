services:
  luckydrop-tma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luckydrop-tma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/snapshot"]
      interval: 30s
      timeout: 5s
      retries: 3
